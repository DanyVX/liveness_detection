[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liveness-detection"
version = "0.0.1"
description = "Face presentation-attack detection (print / replay) with honest, cross-dataset evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
landmarks = ["mediapipe>=0.10"]
# Heavy (torch wheel is >500 MB). Install only with explicit intent; see docs/DESIGN.md.
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "onnx>=1.16"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "onnx>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liveness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["liveness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not gpu'"
markers = [
    "slow: slow tests, skipped by default",
    "gpu: tests that need a GPU, skipped by default",
]

[tool.coverage.run]
source = ["liveness"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
